services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fittrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"
    volumes:
      - fit_track_ai_pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/fittrack

      - JWT_SECRET=change-me
      - JWT_ALG=HS256
      - ACCESS_TOKEN_EXPIRES_MINUTES=30
      - REFRESH_TOKEN_EXPIRES_DAYS=7
      - BACKEND_CORS_ORIGINS=http://localhost:3000
    depends_on:
      - db

    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  fit_track_ai_pgdata:

