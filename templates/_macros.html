{% macro sparkline(values, cls='') -%}
{%- if values and values|length > 1 -%}
{%- set vmin = values|min -%}
{%- set vmax = values|max -%}
{%- set vrange = (vmax - vmin) if vmax != vmin else 1 -%}
{%- set n = values|length -%}
<svg class="spark {{ cls }}" width="100%" height="22" viewBox="0 0 100 22" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="currentColor" stroke-width="2" points="{% for v in values %}{{ '%.1f'|format(loop.index0 / (n - 1) * 100) }},{{ '%.1f'|format(20 - ((v - vmin) / vrange * 18)) }}{% if not loop.last %} {% endif %}{% endfor %}"/></svg>
{%- endif -%}
{%- endmacro %}
