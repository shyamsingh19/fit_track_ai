[tool.poetry]
name = "fit-track-ai-backend"
version = "0.1.0"
description = "Fit Track AI backend"
authors = ["BlackboxAI <noreply@example.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
ulid-py = "^1.1.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
SQLAlchemy = "^2.0.34"
psycopg = { version = "^3.2.1", extras = ["binary"] }
alembic = "^1.13.2"
pydantic = "^2.8.2"
pydantic-settings = "^2.4.0"
python-jose = "^3.3.0"
passlib = { version = "^1.7.4", extras = ["bcrypt"] }
python-multipart = "^0.0.9"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
ruff = "^0.6.6"
black = "^24.8.0"

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

